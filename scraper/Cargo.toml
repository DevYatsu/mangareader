[package]
name = "manga-scraper"
version = "0.1.0"
edition = "2024"

[lib]
name = "scraper"

[[bin]]
name = "scraper"
path = "src/main.rs"

[dependencies]
mangaread-core = { path = "../mangaread-core" }
thirtyfour = "0.37"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
selectrs = { version = "0.21", package = "scraper" }
regex-lite = "0.1"
