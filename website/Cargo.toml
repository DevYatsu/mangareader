[package]
name = "website"
version = "0.1.0"
edition = "2024"

[dependencies]
mangaread-core = { path = "../mangaread-core" }
manga-scraper = { path = "../scraper" }
axum = "0.8"
maud = "0.27"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
anyhow = "1"
thirtyfour = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "std"] }
